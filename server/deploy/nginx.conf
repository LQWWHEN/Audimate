server {
    listen 80;
    server_name PUBLIC_IP;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://PUBLIC_IP$request_uri; }
}

server {
    listen 443 ssl;
    server_name PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/audimate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audimate/privkey.pem;
    client_max_body_size 1m;
    location = /internal/media-auth {
        internal;
        proxy_pass http://127.0.0.1:17881/internal/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        access_log off;
    }
    location ^~ /rtc {
        auth_request /internal/media-auth;
        access_log off;
        error_log /dev/null;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:7880;
    }
    location / {
        proxy_pass http://127.0.0.1:17881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";
    }
}
