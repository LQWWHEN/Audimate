<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#162f32" />
    <title>Audimate · 音乐房间</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/livekit.js" defer></script>
    <script src="/media.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand"><i aria-hidden="true">♫</i> Audimate</div>
      <div id="account" hidden>
        <span id="username"></span
        ><button id="logout" class="quiet">退出</button>
      </div>
    </header>
    <main>
      <section id="auth" class="login">
        <div class="cover" aria-hidden="true">
          <div class="disc"><b>♪</b></div>
        </div>
        <form id="authform">
          <h1 id="authTitle">登录音乐房间</h1>
          <div class="switch">
            <button type="button" id="loginTab" aria-pressed="true">登录</button
            ><button type="button" id="registerTab" aria-pressed="false">
              注册
            </button>
          </div>
          <label for="name">用户名</label
          ><input
            id="name"
            autocomplete="username"
            required
            minlength="2"
            maxlength="32"
          />
          <label for="password">密码</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="8"
            maxlength="128"
          />
          <button id="submit" class="primary">登录</button>
        </form>
      </section>
      <section id="room" hidden>
        <div class="title">
          <h1>音乐房间</h1>
          <span id="members"></span>
        </div>
        <article class="player">
          <div class="small-disc" aria-hidden="true"></div>
          <div>
            <div class="eyebrow">当前音源</div>
            <h2 id="source">等待主持上台</h2>
            <p id="hostInfo"></p>
          </div>
          <button id="listen" class="light">收听</button>
        </article>
        <audio id="liveAudio" autoplay></audio>
        <div class="signal"><span id="actual">尚未收听</span><output id="latency"></output><button id="sync" class="quiet" disabled>手动同步</button></div>
        <div class="desk">
        <section class="strip"><h2>收听设置</h2>
          <label>接收音质<select id="receive"><option value="opus">节省流量 · Opus</option><option value="pcm">优先无损</option></select></label>
          <label class="check"><input id="auto" type="checkbox" checked>自动校准延迟</label>
          <label>校准间隔<select id="interval"><option value="5">5 秒</option></select></label>
        </section>
        <section class="strip"><h2>主持台</h2><div class="actions">
          <label for="codec">上传格式</label><select id="codec"><option value="opus">Opus · 128 kbps</option><option value="opus64">Opus · 64 kbps</option><option value="opus256">Opus · 256 kbps</option><option value="pcm">无损 PCM</option><option value="flac">无损 PCM · FLAC 压缩</option></select>
          <label for="quality">采集预设</label>
          <select id="quality">
            <option value="48000/16">标准 · 48 kHz / 16-bit</option>
            <option value="44100/16">CD · 44.1 kHz / 16-bit</option>
            <option value="96000/24">录音室 · 96 kHz / 24-bit</option>
          </select>
          <label for="hostThreshold">同步阈值（秒）</label>
          <input type="number" step="0.001" min="0" id="hostThreshold" placeholder="跟随房间" aria-describedby="syncHint">
          <small id="syncHint">建议 ≥ 1.0 秒</small>
          <button id="applyThreshold" hidden>应用</button>
          <button id="stage" class="primary" disabled aria-describedby="shareHelp">主持 · 共享音频</button
          ><button id="cancel" class="quiet" hidden>取消申请</button>
        </div>
        <p id="shareHelp">
          <span id="chooseSourceHelp">选择播放器窗口或音乐标签页后点击「共享」。如果音频未预选，请勾选共享音频。找不到播放器时，请从任务栏或托盘还原窗口。</span>
          <span id="stopSourceHelp" hidden>点「下台」即可停止共享。如果浏览器浮窗上有「隐藏」，可以点它收起浮窗，音乐会继续播放。</span>
        </p>
        <div id="requests"></div></section></div>
      </section>
      <p id="notice" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
