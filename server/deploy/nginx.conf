server {
    listen 80;
    server_name PUBLIC_IP;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://PUBLIC_IP$request_uri; }
}

server {
    listen 443 ssl;
    server_name PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/audimate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audimate/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:17881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";
    }
}
